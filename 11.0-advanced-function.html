<!DOCTYPE html>
<html>
  <head>
    <title>Advanced function</title>
  </head>
  <body>
    <script>
      greetings();
      function greetings()//easier to read, hoisting -means before create code like line 8
      {
        console.log('hello');
      }
      greetings();  

      const num=2;//means 2 can be store in num variable 
      
      const function1=function greetings()//in js function are value;
      {
        console.log('hello2');
      }
      console.log(function1);
      console.log(typeof function1);

      function1();//print hello2

       //anonymous function
      const function2=function()//in js function function name i not needed becaue infront function2 has a function name 
      {
        console.log('hello3');
      }
      console.log(function2);
      console.log(typeof function2);

      function2();//print hello2  


      const object1={
        num:2,
        //fun:function greetings()
        fun:function()//annonymou function
        {
          console.log('hello4');
        }
      };
      object1.fun();

      function display(params) {
        console.log(params);
      }
      display(333);

      //passing function into another function

      function run(params) {
        console.log(typeof params);//this parameter in run function but it alo function because passing value using another function
        params();
      }

      run(function() {
        console.log('hello5');
      });

      //setTimeout

      setTimeout(function(){
        console.log('timeout')
      },3000); //after 3 second that function can be run and diplay function ,thi is the best example of callback function 

      //asynchronou code(won't wait for line to finish before going to the next line)(line 65)

      //synchronou code( wait for one line to finish before going to the next line)normally js code run line by line

      console.log('next line');//first display next line then after 3 second timeout can be display

      //setInterval(it can be keep givenn Second repeat)

      let interval=setInterval(function(){//this also aynchronous code
        console.log('interval');
      },3000);//it can be keep every three second

      //clearInterval
      clearInterval(interval);//stop interval




      ['make dinner','wash cloth','watch youtube'].forEach(function(value,index) {
        console.log(index);
        console.log(value);
      });

      //now we seee practical exapmle of for each loop in 11.3

      //variou function to be seee

      //1-filter
      //it can be create new array check it return true means put value not mean not put

      //important it can avoid of loop then get alla values inarray and processs it based on the user condition

      const arrr=[1,-3,5].filter((value,index)=>{
        if(value>=0) return true;

        else return false;

      });
      console.log(arrr);

      //2-map
      //it means create new array what can you return that alll can be store in the that new array then return it baed on user need 

      //important it can avoid of loop then get alla values inarray and processs it based on the user condition
      const arr=[1,1,3].map((value,index)=>{
          return value *2;
      });
      console.log(arr);
      //now shortant of the above function

      const arr1=[1,2,3].map(value => value*2);
      console.log(arr1);

      //closure
      //it means function has access to value
      //it will always have access to that value it only inside function acesss 
      //in above line 113 index i one parameter that value only use that function if outside of function we used means error that is 'closure'
    </script>
  </body>
</html>
