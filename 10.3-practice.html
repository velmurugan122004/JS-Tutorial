<!DOCTYPE html>
<html>
  <head>
    <title>Practice Advance loops and arrays</title>
  </head>
  <body>
    <script>
      //10 v
      function fizzbuzz(number)
      {
        for(let i=1;i<=number;i++)
        {
          if(i%3===0 && i%5===0)
          {
            console.log('FizzBuzz');
          }
          else if(i%3===0)
          {
            console.log('Fizz');
          }
          else if(i%5===0)
          {
            console.log('Buzz');
          }
          else{
            console.log(`${i} `);
          }
        }
      }
      fizzbuzz(20);

      //10w
      function findIndex(array,word)
      {
        for(let i=0;i<array.length;i++)
        {
          if(array[i]===word)
          {
            return i;
          }
        }
        return -1;
      }

      function unique(array)
      {
        const arr= [] ;
        for(let i=0;i<array.length;i++)
        {
          if(findIndex(arr,array[i])===-1)
          {
            arr.push(array[i]);
          }
        }
        return arr;
      }
      console.log(unique(['green', 'red', 'blue', 'red']));
      console.log(unique(['red', 'green', 'green', 'red']));

    </script>
  </body>
</html>
